seed: 42
output_dir: outputs/smoke_visdrone_mini
device: auto
gpu: null
distributed: false

dataset:
  name: visdrone
  root: ../Datasets/VisDrone
  train_split: train
  val_split: val
  num_classes: 10
  img_size: 512
  max_size: 768
  min_area: 1
  max_samples: 4
  strict_bbox: false
  augment:
    multi_scale: [512]
    zoom_crop_prob: 0.0
    zoom_crop_ratio: [1.0, 1.0]
    zoom_crop_min_boxes: 1
    zoom_crop_min_small_keep: 0
    zoom_crop_min_visibility: 0.5
    small_area_thr: 1024
    zoom_crop_attempts: 1

model:
  num_classes: 10
  num_queries: 100
  hidden_dim: 128
  nheads: 4
  num_feature_levels: 4
  enc_layers: 1
  dec_layers: 2
  dim_feedforward: 256
  dropout: 0.1
  num_points: 4
  return_intermediates: true
  backbone: resnet18
  pretrained_backbone: false
  pretrained_backbone_path: null
  use_p2: false
  train_backbone_layers: [layer2, layer3, layer4]
  encoder_feature_indices: null
  scale_aware_query:
    enabled: false
    groups: 2
    strength: 0.0

acq:
  enabled: true
  lambda_acq: 0.01
  small_area_thr: 1024
  topk_unmatched: 10
  delta: 0.03
  sigma: 0.06
  min_score: 0.20
  apply_last_n_layers: 1

rsnds:
  enabled: true
  beta: 1.0
  gamma_base: 1.0
  gamma_min: 0.35
  gamma_max: 1.25
  reliability: cls_conf

loss:
  eos_coef: 0.1
  cost_class: 2.0
  cost_bbox: 5.0
  cost_giou: 2.0
  weight_class: 1.0
  weight_bbox: 5.0
  weight_giou: 2.0
  aux_loss_weight: 0.5
  aux_loss_layers: all
  small_object_cost_gain: 0.0
  small_object_loss_gain: 0.0

train:
  epochs: 1
  batch_size: 1
  num_workers: 0
  lr: 0.0001
  lr_backbone: 0.00001
  weight_decay: 0.0001
  clip_max_norm: 0.1
  print_freq: 1
  val_freq: 1
  amp: false
  amp_init_scale: 512
  amp_growth_interval: 2000
  amp_backoff_factor: 0.5
  scheduler: multistep
  warmup_epochs: 0
  lr_drop_epochs: [1]
  lr_drop_gamma: 0.1
  ema:
    enabled: false
    decay: 0.9997
    eval: false
  deterministic: false
  benchmark: false
  persistent_workers: false
  prefetch_factor: 2
  resume: null
  skip_nonfinite: true
  max_consecutive_nonfinite: 5
  debug_dir: outputs/debug

eval:
  score_thresh: 0.01
  max_detections: 100
  min_detections: 20
  use_coco_eval: true
  iou_thresholds: [0.50, 0.75]
  dense_small_count_thr: 5
