seed: 42
output_dir: outputs/acds_detr
device: auto
gpu: null
distributed: false

dataset:
  name: visdrone
  root: ../Datasets/VisDrone
  train_split: train
  val_split: val
  num_classes: 10
  img_size: 800
  max_size: 1333
  min_area: 1
  strict_bbox: false
  augment:
    multi_scale: [640, 704, 768, 800, 864, 928]
    zoom_crop_prob: 0.35
    zoom_crop_ratio: [0.55, 1.0]
    zoom_crop_min_boxes: 1
    zoom_crop_min_small_keep: 0
    zoom_crop_min_visibility: 0.35
    small_area_thr: 1024
    zoom_crop_attempts: 10

model:
  num_classes: 10
  num_queries: 300
  hidden_dim: 256
  nheads: 8
  num_feature_levels: 4
  enc_layers: 3
  dec_layers: 6
  dim_feedforward: 1024
  dropout: 0.1
  num_points: 4
  return_intermediates: false
  backbone: resnet50
  pretrained_backbone: true
  pretrained_backbone_path: null
  use_p2: false
  train_backbone_layers: [layer2, layer3, layer4]
  encoder_feature_indices: null
  scale_aware_query:
    enabled: false
    groups: 3
    strength: 1.0

acq:
  enabled: true
  lambda_acq: 0.1
  small_area_thr: 1024
  topk_unmatched: 50
  delta: 0.03
  sigma: 0.05
  min_score: 0.3
  apply_last_n_layers: 2

rsnds:
  enabled: true
  beta: 1.0
  gamma_base: 1.0
  gamma_min: 0.25
  gamma_max: 1.5
  reliability: cls_conf

loss:
  eos_coef: 0.1
  cost_class: 2.0
  cost_bbox: 5.0
  cost_giou: 2.0
  weight_class: 1.0
  weight_bbox: 5.0
  weight_giou: 2.0
  aux_loss_weight: 0.5
  aux_loss_layers: all
  small_object_cost_gain: 0.0
  small_object_loss_gain: 0.0

train:
  epochs: 200
  batch_size: 10
  num_workers: 12
  lr: 0.00005
  lr_backbone: 0.000005
  weight_decay: 0.0001
  clip_max_norm: 0.1
  print_freq: 1
  val_freq: 10
  amp: true
  amp_init_scale: 1024
  amp_growth_interval: 1000
  amp_backoff_factor: 0.5
  scheduler: multistep
  warmup_epochs: 2
  lr_drop_epochs: [140, 180]
  lr_drop_gamma: 0.1
  ema:
    enabled: true
    decay: 0.9997
    eval: true
  deterministic: false
  benchmark: false
  persistent_workers: true
  prefetch_factor: 2
  resume: null
  skip_nonfinite: true
  max_consecutive_nonfinite: 20
  debug_dir: outputs/debug

eval:
  score_thresh: 0.03
  max_detections: 300
  min_detections: 100
  use_coco_eval: true
  iou_thresholds: [0.50, 0.55, 0.60, 0.65, 0.70, 0.75, 0.80, 0.85, 0.90, 0.95]
  dense_small_count_thr: 20
