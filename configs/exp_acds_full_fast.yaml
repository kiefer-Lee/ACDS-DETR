_base_: exp_acds_full_stable.yaml

output_dir: outputs/exp_acds_full_fast

dataset:
  img_size: 640
  max_size: 1024
  augment:
    multi_scale: [512, 576, 640, 704]
    zoom_crop_prob: 0.2
    zoom_crop_ratio: [0.65, 1.0]
    zoom_crop_min_boxes: 1
    zoom_crop_attempts: 6

model:
  num_queries: 200
  enc_layers: 2
  dec_layers: 4
  return_intermediates: false

loss:
  aux_loss_layers: 2

acq:
  topk_unmatched: 20
  min_score: 0.5

train:
  amp: true
  benchmark: true
  batch_size: 2
  num_workers: 4
  persistent_workers: true
  prefetch_factor: 4
  val_freq: 5
  print_freq: 50
  debug_dir: outputs/exp_acds_full_fast/debug

