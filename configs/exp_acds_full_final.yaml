_base_: exp_acds_full_stable.yaml

output_dir: outputs/exp_acds_full_final

train:
  epochs: 100
  lr: 0.00005
  lr_backbone: 0.000005
  clip_max_norm: 0.05
  debug_dir: outputs/exp_acds_full_final/debug

acq:
  enabled: true
  lambda_acq: 0.05
  small_area_thr: 1024
  topk_unmatched: 50
  delta: 0.03
  sigma: 0.05
  min_score: 0.4
  apply_last_n_layers: 2

rsnds:
  enabled: true
  beta: 1.0
  gamma_base: 1.0
  gamma_min: 0.25
  gamma_max: 1.25
  reliability: cls_conf

