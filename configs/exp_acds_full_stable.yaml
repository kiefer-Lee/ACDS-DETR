_base_: exp_baseline_stable.yaml

output_dir: outputs/exp_acds_full_stable

acq:
  enabled: true
  lambda_acq: 0.02
  small_area_thr: 1024
  topk_unmatched: 30
  delta: 0.03
  sigma: 0.05
  min_score: 0.5
  apply_last_n_layers: 2

rsnds:
  enabled: true
  beta: 1.0
  gamma_base: 1.0
  gamma_min: 0.5
  gamma_max: 1.0
  reliability: cls_conf

train:
  debug_dir: outputs/exp_acds_full_stable/debug

