_base_: paper_ablation_highres.yaml

output_dir: outputs/paper_ablation_p2_p3

model:
  num_feature_levels: 5
  use_p2: true
  # P2 participates in deformable decoder cross-attention, while the
  # quadratic vanilla encoder skips it to keep 24GB GPUs usable.
  encoder_feature_indices: [1, 2, 3, 4]
  train_backbone_layers: [layer2, layer3, layer4]
