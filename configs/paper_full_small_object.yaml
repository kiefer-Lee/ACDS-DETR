_base_: paper_ablation_aug.yaml

output_dir: outputs/paper_full_small_object

model:
  num_queries: 900
  num_feature_levels: 5
  use_p2: true
  encoder_feature_indices: [1, 2, 3, 4]
  scale_aware_query:
    enabled: true
    groups: 3
    strength: 0.5

loss:
  small_object_cost_gain: 0.35
  small_object_loss_gain: 0.75

eval:
  score_thresh: 0.03
  max_detections: 500
