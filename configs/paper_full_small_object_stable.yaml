_base_: paper_full_small_object.yaml

output_dir: outputs/paper_full_small_object_stable

acq:
  lambda_acq: 0.03
  min_score: 0.4
  topk_unmatched: 30

rsnds:
  gamma_min: 0.35
  gamma_max: 1.25

loss:
  small_object_cost_gain: 0.20
  small_object_loss_gain: 0.35

train:
  lr: 0.00004
  lr_backbone: 0.000001
  clip_max_norm: 0.05
  amp: true
  amp_init_scale: 512
  amp_growth_interval: 2000
  amp_backoff_factor: 0.5
  max_consecutive_nonfinite: 10
